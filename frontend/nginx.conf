server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTTP ETags for cache revalidation (304 Not Modified)
    etag on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # summary.json: revalidate frequently so updates show immediately
    location = /api/summary.json {
        alias /usr/share/nginx/html/api/summary.json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }
    # switching_graph.json: revalidate frequently so updates show immediately
    location = /api/switching_graph.json {
        alias /usr/share/nginx/html/api/switching_graph.json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }


    # Fund details: cache for 1 hour
    location /api/ {
        alias /usr/share/nginx/html/api/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, s-maxage=86400, stale-while-revalidate=43200";
        add_header Access-Control-Allow-Origin *;
    }

    # Hashed JS/CSS assets (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA HTML fallback: no-cache to always serve latest bundle references
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
